# Decap CMS – a simple editing screen for the site, at /admin/ once hosted on Netlify.
# Sign-in is with your GitHub account, through the GitHub OAuth provider installed on the Netlify project.
backend:
  name: github
  repo: SocialIntent/social-intent-site
  branch: main

media_folder: "src/assets/uploads"
public_folder: "assets/uploads"
site_url: https://www.social-intent.com
display_url: https://www.social-intent.com
logo_url: https://www.social-intent.com/assets/img/si-logo-main-black-yellow.svg

collections:
  - name: insights
    label: Insights (news)
    label_singular: Insight
    folder: src/insights
    create: true
    slug: "{{slug}}"
    extension: md
    editor: { preview: false }
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: One-line summary, name: summary, widget: text, hint: "Shown in the list and on the home page. One or two sentences." }
      - { label: Article, name: body, widget: markdown }

  - name: work
    label: Case studies
    label_singular: Case study
    folder: src/work
    create: true
    slug: "{{slug}}"
    extension: md
    editor: { preview: false }
    fields:
      - { label: Title, name: title, widget: string, hint: "The story's headline, e.g. 'Driving with the brakes on'" }
      - { label: Client, name: client, widget: string, hint: "Organisation and place" }
      - { label: Order on the page, name: order, widget: number, default: 10, value_type: int }
      - { label: Sector, name: sector, widget: string, required: false }
      - { label: What we did, name: services, widget: string, hint: "Separate with · e.g. Strategy · Theory of Change" }
      - { label: Year, name: year, widget: string, required: false }
      - { label: One-line summary, name: summary, widget: text }
      - { label: Client quote, name: quote, widget: text, required: false }
      - { label: Quote by, name: quoteBy, widget: string, required: false }
      - { label: Their role, name: quoteRole, widget: string, required: false }
      - label: Key facts
        name: facts
        widget: list
        required: false
        hint: "Up to four big numbers, e.g. 12 weeks"
        fields:
          - { label: Number, name: n, widget: string }
          - { label: Label, name: label, widget: string }
      - { label: Case study, name: body, widget: markdown }

  - name: resources
    label: Guides (shop)
    label_singular: Guide
    folder: src/resources
    create: true
    slug: "{{slug}}"
    extension: md
    editor: { preview: false }
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Kind, name: kind, widget: select, options: [Guide, Workbook, Decision guide, Starter guide, Toolkit, Template] }
      - { label: Pages, name: pages, widget: number, value_type: int }
      - { label: For, name: for, widget: select, options: [charities, companies, athletes] }
      - { label: Who it's for, name: audience, widget: string, hint: "e.g. trustees, CEOs and finance leads" }
      - { label: Status, name: status, widget: select, options: [available, coming-soon], default: coming-soon }
      - { label: Order on the page, name: order, widget: number, default: 10, value_type: int }
      - { label: Price (£), name: price, widget: number, default: 20, value_type: int, required: false }
      - { label: Payhip product link, name: payhip, widget: string, required: false, hint: "From Payhip: Products › your product › Share › link, e.g. https://payhip.com/b/AbCd1" }
      - { label: Payhip product ID, name: payhipId, widget: string, required: false, hint: "The code at the end of the link, e.g. AbCd1" }
      - { label: One-line summary, name: summary, widget: text }
      - { label: Page title for Google, name: seoTitle, widget: string, required: false, hint: "Used on the guide's own page, about 60 characters" }
      - { label: Page description for Google, name: seoDescription, widget: text, required: false, hint: "About 150 characters" }
      - { label: Opening line on the guide page, name: lead, widget: text, required: false }
      - { label: Who it is for (guide page), name: whoFor, widget: text, required: false }
      - { label: What is inside (guide page), name: inside, widget: list, required: false, field: { label: Item, name: item, widget: string } }
      - label: Questions and answers (guide page)
        name: qa
        widget: list
        required: false
        hint: "Short, plain answers of around 40 to 60 words. Shown on the guide page and read by Google and AI tools."
        fields:
          - { label: Question, name: q, widget: string }
          - { label: Answer, name: a, widget: text }
      - { label: Notes (not shown), name: body, widget: markdown, required: false }

  - name: settings
    label: Site settings
    editor: { preview: false }
    files:
      - name: site
        label: Site settings
        file: src/_data/site.json
        fields:
          - label: Ampersand
            name: ampersand
            widget: object
            collapsed: false
            fields:
              - { label: Show Ampersand on the site, name: listed, widget: boolean, default: false, hint: "Off: the page exists at /ampersand.html but is not in the menu, not on the home page, and hidden from Google. On: in the menu and footer, the film and band on the home page, and open to Google. Click Publish to make it happen; the site rebuilds in about a minute." }
              - { label: Date (in words), name: date, widget: string }
              - { label: Place, name: place, widget: string }
              - { label: Email for the event, name: email, widget: string }
              - { label: Hero film file, name: video, widget: string, hint: "Leave as it is unless you rename the film" }
              - { label: Square film file, name: videoSquare, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: Phone (as shown), name: phone, widget: string }
          - { label: Phone for tap-to-call, name: phoneHref, widget: string, hint: "International form with no spaces, e.g. +441618705544" }
          - { label: Calendly link, name: calendly, widget: string }
          - { label: LinkedIn, name: linkedin, widget: string }
          - { label: Instagram, name: instagram, widget: string }
          - label: Postal address
            name: address
            widget: list
            field: { label: Line, name: line, widget: string }
          - { label: Company number, name: companyNumber, widget: string }
          - { label: VAT number, name: vatNumber, widget: string }
          - { label: Founder, name: founder, widget: string }
          - { label: Payhip shop link, name: payhipStore, widget: string }
          - { label: Guide price (£), name: guidePrice, widget: number, value_type: int }
          - { label: Site name, name: name, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Site address, name: url, widget: string }
          - { label: Description for Google and social sharing, name: description, widget: text }
          - label: Menu
            name: nav
            widget: list
            collapsed: true
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Page, name: href, widget: string, hint: "e.g. charities.html" }
